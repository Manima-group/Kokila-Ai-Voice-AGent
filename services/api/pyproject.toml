[project]
name = "kokila-api"
version = "5.0.0"
description = "Kokila shared control plane and conversation API (Manima AI-Tech Solutions)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyotp>=2.9",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4,<6",
  "orjson>=3.10",
  "email-validator>=2.2",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]  # line length enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S608"]
"alembic/**" = ["S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
