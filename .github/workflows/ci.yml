name: CI

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kokila, POSTGRES_PASSWORD: kokila, POSTGRES_DB: kokila_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kokila" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    env:
      DATABASE_URL: postgresql+psycopg://kokila:kokila@localhost:5432/kokila_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check app tests alembic && ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Tests (includes migration upgrade/downgrade/upgrade)
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t kokila-api:ci backend
          docker build -t kokila-web:ci frontend
      - name: Smoke test stack
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^ENCRYPTION_KEY=|ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" .env
          docker compose up -d --build
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/ready && break; sleep 3; done
          curl -fsS http://localhost:8000/ready
          curl -fsS -o /dev/null http://localhost:3000/
          docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kokila-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
